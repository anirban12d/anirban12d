<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="400" height="60" viewBox="0 0 400 60" role="img" aria-label="Selected work: reports from the field"><title>Selected work: reports from the field</title><style>@font-face{font-family:dc-label;src:url(data:font/woff2;base64,) format("woff2")}.f-label{font-family:dc-label}.c-ink{fill:#16161A}.s-ink{stroke:#16161A}.c-muted{fill:#66666A}.s-muted{stroke:#66666A}.c-hair{fill:rgba(22,22,26,.18)}.s-hair{stroke:rgba(22,22,26,.18)}.c-band{fill:#16161A}.s-band{stroke:#16161A}.c-on-band{fill:#FAFAF8}.s-on-band{stroke:#FAFAF8}.c-wash{fill:rgba(22,22,26,.04)}.s-wash{stroke:rgba(22,22,26,.04)}.c-zero{fill:rgba(22,22,26,.14)}.s-zero{stroke:rgba(22,22,26,.14)}.c-screen{fill:rgba(255,255,255,.22)}.s-screen{stroke:rgba(255,255,255,.22)}.c-paper{fill:#FFFFFF}.s-paper{stroke:#FFFFFF}text{font-kerning:normal;font-variant-ligatures:common-ligatures}@keyframes ink{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes develop{0%{opacity:0;filter:blur(8px) contrast(.4) brightness(1.5)}60%{opacity:1}100%{opacity:1;filter:none}}.ink{animation:ink .5s ease-out both}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.develop{animation:develop 2.2s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect width="100%" height="100%" class="c-paper"/><line x1="0.0" y1="1.0" x2="400.0" y2="1.0" class="s-ink" stroke-width="2" /><rect x="0.0" y="13.0" width="119.7" height="19.0" class="c-band" /><text x="8.0" y="26.0" class="f-label c-on-band" font-size="9.5" letter-spacing="1.52">SELECTED WORK</text><text x="400.0" y="26.0" class="f-label c-muted" font-size="9.5" letter-spacing="1.52" text-anchor="end">6 CASE FILES</text><text x="0.0" y="50.0" class="f-label c-muted" font-size="9" letter-spacing="1.44">REPORTS FROM THE FIELD · TAP A CARD TO OPEN</text></svg>